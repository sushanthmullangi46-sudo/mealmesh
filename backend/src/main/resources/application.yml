server:
  port: 8080

spring:
  application:
    name: mealmesh-backend
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Kolkata
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    serialization:
      fail-on-empty-beans: false
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Kolkata
  datasource:
    url: jdbc:h2:file:./data/mealmesh;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false # Handled via JPA update in dev, Flyway enabled in postgres profile

mealmesh:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173"
  timezone: Asia/Kolkata
  currency: INR

logging:
  level:
    com.mealmesh: INFO
    org.springframework.security: WARN
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mealmesh}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

# Runs the same single container as the public deployment.
# Usage: docker compose up --build   ->  http://localhost:8080
services:
  mealmesh:
    build: .
    container_name: mealmesh
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - mealmesh_data:/app/data   # keeps the H2 database between restarts

volumes:
  mealmesh_data:

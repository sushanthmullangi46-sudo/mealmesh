version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: route_opt_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: route_optimization
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: route_opt_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/route_optimization
      SECRET_KEY: super-secret-production-key-dsa-route-system-2026
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: route_opt_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:

